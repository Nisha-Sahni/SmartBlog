<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions & Answers | SmartBlog</title>
    <link rel="stylesheet" href="questions.css">
    <script src="questions.js" defer></script>
</head>
<body>
    <aside class="sidebar">
        <h2 class="logo">Smart<span>Blog.</span></h2>
        <nav>
            <a href="dashboard.html">⌂ Home</a>
            <a href="explore.html">⌕ Explore</a>
            <a href="questions.html" class="active">？ Questions</a>
            <a href="create-blog.html">＋ Create Blog</a>
            <a href="profile.html">◉ Profile</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p class="eyebrow">COMMUNITY SPACE</p>
                <h1>Questions & Answers</h1>
                <p class="subtitle">Ask questions, share knowledge, and learn together.</p>
            </div>
            <button id="askQuestionBtn" class="primary-btn">+ Ask a question</button>
        </header>

        <section class="search-area">
            <input id="searchInput" type="search"
                placeholder="Search questions by title or topic...">
            <select id="topicFilter">
                <option value="All">All topics</option>
                <option value="Technology">Technology</option>
                <option value="Programming">Programming</option>
                <option value="Career">Career</option>
                <option value="College">College</option>
                <option value="Writing">Writing</option>
            </select>
        </section>

        <section id="questionFormSection" class="question-form hidden">
            <h2>Ask the community</h2>
            <form id="questionForm">
                <label for="questionTitle">Question title</label>
                <input id="questionTitle" type="text"
                    placeholder="What do you want to know?" required>

                <label for="questionDetails">Add details</label>
                <textarea id="questionDetails"
                    placeholder="Explain your question..." rows="4"></textarea>

                <label for="questionTopic">Topic</label>
                <select id="questionTopic" required>
                    <option value="Technology">Technology</option>
                    <option value="Programming">Programming</option>
                    <option value="Career">Career</option>
                    <option value="College">College</option>
                    <option value="Writing">Writing</option>
                </select>

                <div class="form-actions">
                    <button type="button" id="cancelQuestionBtn" class="secondary-btn">
                        Cancel
                    </button>
                    <button type="submit" class="primary-btn">Post question</button>
                </div>
            </form>
        </section>

        <section class="question-section">
            <div class="section-heading">
                <h2>Community questions</h2>
                <span id="questionCount">0 questions</span>
            </div>
            <div id="questionsList"></div>
            <p id="emptyMessage" class="empty-message hidden">
                No questions found. Try another search or ask a question!
            </p>
        </section>
    </main>
</body>
</html>
